<audio id="bg-audio" loop preload="auto" aria-hidden="true">
    <source src="/assets/audio/mil-chatter.mp3" type="audio/mpeg" />
</audio>

<button id="audio-toggle"
        class="audio-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Play background audio"
        title="Play or pause background audio">
    <span class="audio-toggle__icon audio-toggle__icon--play is-active bx-play" aria-hidden="true"></span>
    <span class="audio-toggle__icon audio-toggle__icon--pause bx-pause" aria-hidden="true"></span>
    <span class="sr-only">Background audio</span>
</button>
