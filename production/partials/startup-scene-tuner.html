<div id="wz-intro-startup-tuner-slot" hidden>
    <div class="wz-dev-label">STARTUP SCENE TUNER</div>
    <div class="wz-dev-map-tuner" id="wz-intro-startup-scene-tuner">
        <label class="wz-dev-map-row">
            <span>Start Longitude</span>
            <input id="wz-intro-startup-lon-range" type="range" min="-180" max="180" step="0.1">
            <input id="wz-intro-startup-lon-input" class="wz-dev-input wz-dev-map-value" type="number" min="-180" max="180" step="0.1">
        </label>
        <label class="wz-dev-map-row">
            <span>Start Latitude</span>
            <input id="wz-intro-startup-lat-range" type="range" min="-85" max="85" step="0.1">
            <input id="wz-intro-startup-lat-input" class="wz-dev-input wz-dev-map-value" type="number" min="-85" max="85" step="0.1">
        </label>
        <label class="wz-dev-map-row">
            <span>Start Height</span>
            <input id="wz-intro-startup-height-range" type="range" min="2000000" max="15000000" step="50000">
            <input id="wz-intro-startup-height-input" class="wz-dev-input wz-dev-map-value" type="number" min="2000000" max="15000000" step="50000">
        </label>
        <label class="wz-dev-map-row">
            <span>Start Pitch</span>
            <input id="wz-intro-startup-pitch-range" type="range" min="-89" max="-20" step="1">
            <input id="wz-intro-startup-pitch-input" class="wz-dev-input wz-dev-map-value" type="number" min="-89" max="-20" step="1">
        </label>
        <label class="wz-dev-map-row">
            <span>Startup Rotation Speed</span>
            <input id="wz-intro-startup-rotation-speed-range" type="range" min="0.05" max="2" step="0.01">
            <input id="wz-intro-startup-rotation-speed-input" class="wz-dev-input wz-dev-map-value" type="number" min="0.05" max="2" step="0.01">
        </label>
        <label class="wz-dev-map-row">
            <span>Startup Multiplier</span>
            <input id="wz-intro-startup-rotation-multiplier-range" type="range" min="0.1" max="4" step="0.01">
            <input id="wz-intro-startup-rotation-multiplier-input" class="wz-dev-input wz-dev-map-value" type="number" min="0.1" max="4" step="0.01">
        </label>
        <label class="wz-dev-map-row">
            <span>Dummy Sat Rotation Speed</span>
            <input id="wz-intro-startup-sat-rotation-speed-range" type="range" min="0" max="20" step="0.1">
            <input id="wz-intro-startup-sat-rotation-speed-input" class="wz-dev-input wz-dev-map-value" type="number" min="0" max="20" step="0.1">
        </label>
        <label class="wz-dev-map-row">
            <span>Dummy Sat Scale</span>
            <input id="wz-intro-startup-sat-scale-range" type="range" min="10000" max="500000" step="1000">
            <input id="wz-intro-startup-sat-scale-input" class="wz-dev-input wz-dev-map-value" type="number" min="10000" max="500000" step="1000">
        </label>
        <label class="wz-dev-map-row">
            <span>Dummy Sat Min Pixel</span>
            <input id="wz-intro-startup-sat-min-px-range" type="range" min="1" max="120" step="1">
            <input id="wz-intro-startup-sat-min-px-input" class="wz-dev-input wz-dev-map-value" type="number" min="1" max="120" step="1">
        </label>
        <label class="wz-dev-map-row">
            <span>Dummy Sat Max Scale</span>
            <input id="wz-intro-startup-sat-max-scale-range" type="range" min="10000" max="600000" step="1000">
            <input id="wz-intro-startup-sat-max-scale-input" class="wz-dev-input wz-dev-map-value" type="number" min="10000" max="600000" step="1000">
        </label>
        <div class="wz-dev-map-actions">
            <button id="wz-intro-startup-scene-apply" type="button" class="wz-dev-action wz-dev-action--fire">Apply Startup Scene</button>
            <button id="wz-intro-startup-scene-load-current" type="button" class="wz-dev-action">Load Current</button>
            <button id="wz-intro-startup-scene-copy" type="button" class="wz-dev-action">Copy Values</button>
        </div>
        <label class="wz-dev-field wz-dev-field--full">
            <span>Copy these startup values</span>
            <textarea id="wz-intro-startup-scene-output" class="wz-dev-input wz-dev-map-output" rows="14" readonly></textarea>
        </label>
    </div>
</div>
