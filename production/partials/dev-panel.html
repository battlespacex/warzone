<!-- ── DEV TEST PANEL (inlined here because partials need template engine) ── -->
<!-- Activate: localhost auto-shows · ?devpanel=1 in URL · Ctrl+Shift+` anywhere -->
<div id="wz-dev-panel" class="wz-dev-panel" hidden>
    <button type="button" id="wz-dev-toggle" class="wz-dev-toggle">⚙ DEV</button>
    <div id="wz-dev-body" class="wz-dev-body" hidden>
        <div class="wz-dev-heading">⚠ DEV TEST PANEL — LOCAL ONLY</div>
        <div class="wz-dev-grid">
            <div class="wz-dev-label">MISSILE / STRIKE</div>
            <button type="button" class="wz-dev-btn" data-event="missile_iran_israel" style="--c:#ff0753">🚀 Missile — Iran → Israel</button>
            <button type="button" class="wz-dev-btn" data-event="missile_russia_ukraine" style="--c:#ff0753">🚀 Missile — Russia → Ukraine</button>
            <button type="button" class="wz-dev-btn" data-event="drone_kamikaze" style="--c:#ff6a00">🛸 Drone Strike (Shahed)</button>
            <button type="button" class="wz-dev-btn" data-event="airstrike" style="--c:#ff6a00">💥 Air Strike (IAF)</button>

            <div class="wz-dev-label">SIRENS / ALERTS</div>
            <button type="button" class="wz-dev-btn" data-siren="red" style="--c:#d42020">🔴 RED — Sirens (Israel)</button>
            <button type="button" class="wz-dev-btn" data-siren="orange" style="--c:#d45a00">🟠 ORANGE — Sirens (Lebanon)</button>
            <button type="button" class="wz-dev-btn" data-siren="yellow" style="--c:#b88000">🟡 YELLOW — Incoming Warning</button>

            <div class="wz-dev-label">🔴 PULSE HIGHLIGHT</div>
            <button type="button" class="wz-dev-btn" data-highlight="israel" style="--c:#ff2a2a">🇮🇱 Israel (Critical)</button>
            <button type="button" class="wz-dev-btn" data-highlight="uae" style="--c:#ff2a2a">🇦🇪 UAE (High)</button>
            <button type="button" class="wz-dev-btn" data-highlight="iran" style="--c:#ff2a2a">🇮🇷 Iran (Critical)</button>
            <button type="button" class="wz-dev-btn" data-highlight="ukraine" style="--c:#ff2a2a">🇺🇦 Ukraine (High)</button>
            <button type="button" class="wz-dev-btn" data-highlight="clear" style="--c:#444">✖ Clear Highlight</button>

            <div class="wz-dev-label">QUICK AIR PRESETS</div>
            <button type="button" class="wz-dev-btn" data-event="aircraft_fighter" style="--c:#56d80e">✈ Fighter — F-35I (IAF)</button>
            <button type="button" class="wz-dev-btn" data-event="aircraft_awacs" style="--c:#ffd24d">✈ AWACS E-3 (NATO)</button>
            <button type="button" class="wz-dev-btn" data-event="aircraft_recon" style="--c:#ff6a00">✈ Recon RC-135 (USAF)</button>
            <button type="button" class="wz-dev-btn" data-event="aircraft_tanker" style="--c:#00d8b2">✈ Tanker KC-135 (USAF)</button>

            <div class="wz-dev-label">NAVAL</div>
            <button type="button" class="wz-dev-btn" data-event="ship_carrier" style="--c:#ff2a2a">⛵ Carrier — USS Gerald R Ford</button>
            <button type="button" class="wz-dev-btn" data-event="ship_destroyer" style="--c:#9b7bff">⛵ Destroyer — Arleigh Burke</button>
            <button type="button" class="wz-dev-btn" data-event="ship_russian" style="--c:#ff6a00">⛵ Frigate — Gorshkov</button>

            <div class="wz-dev-label">QUICK ROUTE TESTS</div>
            <button type="button" class="wz-dev-btn" data-track-route="fighter_orbit_right">Aircraft Orbit Right</button>
            <button type="button" class="wz-dev-btn" data-track-route="fighter_orbit_left">Aircraft Orbit Left</button>
            <button type="button" class="wz-dev-btn" data-track-route="fighter_turn_test">Aircraft Turn Test</button>

            <button type="button" class="wz-dev-btn" data-track-stop="dev-track-circle-right">Stop Orbit Right</button>
            <button type="button" class="wz-dev-btn" data-track-stop="dev-track-circle-left">Stop Orbit Left</button>
            <button type="button" class="wz-dev-btn" data-track-stop="dev-track-turns">Stop Turn Test</button>


            <div class="wz-dev-label">LIVE ASSET SIMULATOR</div>
            <div class="wz-dev-sim">
                <div class="wz-dev-form-grid">
                    <label class="wz-dev-field">
                        <span>Asset Type</span>
                        <select id="wz-dev-sim-subtype" class="wz-dev-select">
                            <option value="fighter">Fighter</option>
                            <option value="awacs">AWACS</option>
                            <option value="recon">Recon / ISR</option>
                            <option value="tanker">Tanker / Refueler</option>
                            <option value="drone">Drone / UAV</option>
                            <option value="helicopter">Helicopter</option>
                            <option value="transport">Transport / Logistic</option>
                        </select>
                    </label>

                    <label class="wz-dev-field">
                        <span>Motion</span>
                        <select id="wz-dev-sim-motion" class="wz-dev-select">
                            <option value="route">Route</option>
                            <option value="orbit-right">Orbit Right</option>
                            <option value="orbit-left">Orbit Left</option>
                            <option value="turn-test">Turn Test</option>
                        </select>
                    </label>

                    <label class="wz-dev-field wz-dev-field--full">
                        <span>Track Key</span>
                        <input id="wz-dev-sim-trackkey" class="wz-dev-input" type="text" value="dev-sim-fighter">
                    </label>

                    <label class="wz-dev-field wz-dev-field--full">
                        <span>Title</span>
                        <input id="wz-dev-sim-title" class="wz-dev-input" type="text" value="Live Fighter Test">
                    </label>

                    <label class="wz-dev-field">
                        <span>Country</span>
                        <input id="wz-dev-sim-country" class="wz-dev-input" type="text" value="USA">
                    </label>

                    <label class="wz-dev-field">
                        <span>Heading</span>
                        <input id="wz-dev-sim-heading" class="wz-dev-input" type="number" value="45">
                    </label>

                    <label class="wz-dev-field">
                        <span>Start Lat</span>
                        <input id="wz-dev-sim-lat" class="wz-dev-input" type="number" step="0.0001" value="31.5">
                    </label>

                    <label class="wz-dev-field">
                        <span>Start Lon</span>
                        <input id="wz-dev-sim-lon" class="wz-dev-input" type="number" step="0.0001" value="34.9">
                    </label>

                    <label class="wz-dev-field">
                        <span>End Lat</span>
                        <input id="wz-dev-sim-to-lat" class="wz-dev-input" type="number" step="0.0001" value="31.95">
                    </label>

                    <label class="wz-dev-field">
                        <span>End Lon</span>
                        <input id="wz-dev-sim-to-lon" class="wz-dev-input" type="number" step="0.0001" value="35.45">
                    </label>

                    <label class="wz-dev-field">
                        <span>Altitude (ft)</span>
                        <input id="wz-dev-sim-altitude" class="wz-dev-input" type="number" value="35000">
                    </label>

                    <label class="wz-dev-field">
                        <span>Orbit Radius (m)</span>
                        <input id="wz-dev-sim-radius" class="wz-dev-input" type="number" value="25000">
                    </label>

                    <label class="wz-dev-field">
                        <span>Steps</span>
                        <input id="wz-dev-sim-steps" class="wz-dev-input" type="number" value="120">
                    </label>

                    <label class="wz-dev-field">
                        <span>Interval (ms)</span>
                        <input id="wz-dev-sim-interval" class="wz-dev-input" type="number" value="140">
                    </label>

                    <label class="wz-dev-field wz-dev-field--full wz-dev-check">
                        <input id="wz-dev-sim-loop" type="checkbox" checked>
                        <span>Loop simulation</span>
                    </label>
                </div>

                <div class="wz-dev-actions wz-dev-actions--sim">
                    <button type="button" id="wz-dev-sim-start" class="wz-dev-action wz-dev-action--fire">▶ START SIM</button>
                    <button type="button" id="wz-dev-sim-stop" class="wz-dev-action wz-dev-action--clear">■ STOP SIM</button>
                    <button type="button" id="wz-dev-sim-focus" class="wz-dev-action">◎ FOCUS</button>
                    <button type="button" id="wz-dev-sim-reset" class="wz-dev-action">↺ RESET</button>
                </div>
            </div>

            <div class="wz-dev-label">OTHER</div>
            <button type="button" class="wz-dev-btn" data-event="cyber" style="--c:#9b7bff">💻 Cyber — Iran</button>
            <button type="button" class="wz-dev-btn" data-event="thermal" style="--c:#ff7a00">🔥 Thermal — Syria</button>

            <div class="wz-dev-label">MAP COLOR TUNER</div>
            <div class="wz-dev-map-tuner" id="wz-dev-map-tuner">
                <label class="wz-dev-map-row">
                    <span>Saturation</span>
                    <input id="wz-map-saturation-range" type="range" min="0" max="2" step="0.01">
                    <input id="wz-map-saturation-input" class="wz-dev-input wz-dev-map-value" type="number" min="0" max="2" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Brightness</span>
                    <input id="wz-map-brightness-range" type="range" min="0" max="2" step="0.01">
                    <input id="wz-map-brightness-input" class="wz-dev-input wz-dev-map-value" type="number" min="0" max="2" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Contrast</span>
                    <input id="wz-map-contrast-range" type="range" min="0" max="3" step="0.01">
                    <input id="wz-map-contrast-input" class="wz-dev-input wz-dev-map-value" type="number" min="0" max="3" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Gamma</span>
                    <input id="wz-map-gamma-range" type="range" min="0" max="2" step="0.01">
                    <input id="wz-map-gamma-input" class="wz-dev-input wz-dev-map-value" type="number" min="0" max="2" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Hue</span>
                    <input id="wz-map-hue-range" type="range" min="-360" max="360" step="1">
                    <input id="wz-map-hue-input" class="wz-dev-input wz-dev-map-value" type="number" min="-360" max="360" step="1">
                </label>
                <label class="wz-dev-map-row">
                    <span>Tint</span>
                    <input id="wz-map-tint-range" type="range" min="-1" max="1" step="0.01">
                    <input id="wz-map-tint-input" class="wz-dev-input wz-dev-map-value" type="number" min="-1" max="1" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Warmth</span>
                    <input id="wz-map-warmth-range" type="range" min="-1" max="1" step="0.01">
                    <input id="wz-map-warmth-input" class="wz-dev-input wz-dev-map-value" type="number" min="-1" max="1" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Red</span>
                    <input id="wz-map-red-range" type="range" min="0" max="2" step="0.01">
                    <input id="wz-map-red-input" class="wz-dev-input wz-dev-map-value" type="number" min="0" max="2" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Green</span>
                    <input id="wz-map-green-range" type="range" min="0" max="2" step="0.01">
                    <input id="wz-map-green-input" class="wz-dev-input wz-dev-map-value" type="number" min="0" max="2" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Blue</span>
                    <input id="wz-map-blue-range" type="range" min="0" max="2" step="0.01">
                    <input id="wz-map-blue-input" class="wz-dev-input wz-dev-map-value" type="number" min="0" max="2" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Cyan</span>
                    <input id="wz-map-cyan-range" type="range" min="-1" max="1" step="0.01">
                    <input id="wz-map-cyan-input" class="wz-dev-input wz-dev-map-value" type="number" min="-1" max="1" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Magenta</span>
                    <input id="wz-map-magenta-range" type="range" min="-1" max="1" step="0.01">
                    <input id="wz-map-magenta-input" class="wz-dev-input wz-dev-map-value" type="number" min="-1" max="1" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Yellow</span>
                    <input id="wz-map-yellow-range" type="range" min="-1" max="1" step="0.01">
                    <input id="wz-map-yellow-input" class="wz-dev-input wz-dev-map-value" type="number" min="-1" max="1" step="0.01">
                </label>
                <label class="wz-dev-map-row">
                    <span>Alpha</span>
                    <input id="wz-map-alpha-range" type="range" min="0" max="1" step="0.01">
                    <input id="wz-map-alpha-input" class="wz-dev-input wz-dev-map-value" type="number" min="0" max="1" step="0.01">
                </label>

                <div class="wz-dev-map-actions">
                    <button id="wz-map-refresh-only" type="button" class="wz-dev-action">Refresh Map Only</button>
                    <button id="wz-map-load-current" type="button" class="wz-dev-action">Load Current</button>
                    <button id="wz-map-copy-css" type="button" class="wz-dev-action wz-dev-action--fire">Copy :root Block</button>
                </div>

                <label class="wz-dev-field wz-dev-field--full">
                    <span>Copy to <code>root.css</code></span>
                    <textarea id="wz-map-css-output" class="wz-dev-input wz-dev-map-output" rows="9" readonly></textarea>
                </label>
            </div>

            <div class="wz-dev-label">AIRCRAFT CALIBRATION</div>
            <button type="button" id="wz-dev-aircraft-calibrate" class="warzone-btn">
                Aircraft Calibration Mode
            </button>
            <div class="wz-dev-label">NAVAL CALIBRATION</div>
            <button type="button" id="wz-dev-naval-calibrate" class="warzone-btn">
                Naval Calibration Mode
            </button>
            <div class="wz-dev-label">POPUPS</div>
            <div class="wz-dev-actions">
                <button type="button" id="wz-dev-open-performance-warning" class="wz-dev-action">Performance Popup</button>
                <button type="button" id="wz-dev-open-layer-warning" class="wz-dev-action">Warning Popup</button>
            </div>

            <div class="wz-dev-actions">
                <button type="button" id="wz-dev-fire-all" class="wz-dev-action wz-dev-action--fire">⚡ FIRE ALL</button>
                <button type="button" id="wz-dev-clear" class="wz-dev-action wz-dev-action--clear">✕ CLEAR LOG</button>
            </div>
            <div id="wz-dev-log" class="wz-dev-log"></div>
        </div>
    </div>
</div>
