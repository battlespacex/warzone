<aside
    id="wz-intro-startup-scene-tuner"
    class="wz-startup-tuner"
    aria-label="Entry scene developer controls"
    hidden
>
    <header class="wz-startup-tuner__header">
        <div>
            <strong>Entry Scene Tuner</strong>
            <span>Temporary developer panel</span>
        </div>
        <button type="button" data-startup-action="collapse">Collapse</button>
    </header>

    <div class="wz-startup-tuner__body">
        <div class="wz-startup-tuner__pause-row">
            <button type="button" data-startup-action="fullscreen">Full Screen</button>
            <button type="button" data-startup-action="pause-globe">Pause Globe</button>
            <button type="button" data-startup-action="pause-assets">Pause Aircraft</button>
            <button type="button" data-startup-action="pause-satellites">Pause Satellites</button>
        </div>

        <label class="wz-startup-tuner__target">
            <span>Control target</span>
            <select id="wz-intro-startup-scene-target"></select>
        </label>

        <div id="wz-intro-startup-scene-fields" class="wz-startup-tuner__fields"></div>

        <div class="wz-startup-tuner__actions">
            <button type="button" data-startup-action="reset">Reset Selected</button>
            <button type="button" data-startup-action="copy-selected">Copy Selected</button>
            <button type="button" data-startup-action="copy-all">Copy All</button>
        </div>

        <textarea
            id="wz-intro-startup-scene-output"
            class="wz-startup-tuner__output"
            rows="9"
            readonly
            aria-label="Generated root CSS variables"
        ></textarea>
        <p id="wz-intro-startup-scene-status" class="wz-startup-tuner__status" aria-live="polite"></p>
    </div>
</aside>
