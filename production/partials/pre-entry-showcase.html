<template id="tpl-wz-pre-entry-showcase">
    <div
        id="wz-pre-entry-showcase"
        class="wz-pre-entry-showcase"
        role="dialog"
        aria-modal="true"
        aria-labelledby="wz-pre-entry-title"
        aria-describedby="wz-pre-entry-summary"
    >
        <div class="wz-pre-entry-showcase__panel">
            <header class="wz-pre-entry-showcase__header">
                <img
                    src="/assets/images/web/logo-stratops-battlespacex.svg"
                    alt="StratOps by BattlespaceX"
                    class="wz-pre-entry-showcase__logo"
                    width="300"
                    height="79"
                    decoding="async"
                    fetchpriority="high"
                />

                <h1 id="wz-pre-entry-title">
                    Real-Time Multi-Domain Battlespace Intelligence
                </h1>

                <p id="wz-pre-entry-summary">
                    StratOps unifies curated warzone OSINT, satellite monitoring 
                    and live military tracking into a real-time, layered 3D 
                    operational battlespace to command total situational 
                    awareness across air, land, sea, space and cyberspace.
                </p>
            </header>

            <section
                class="wz-pre-entry-showcase__capabilities"
                aria-labelledby="wz-capabilities-title"
            >
                <h2 id="wz-capabilities-title" class="sr-only">
                    StratOps intelligence and military tracking capabilities
                </h2>

                <div class="wz-pre-entry-showcase__grid wz-pre-entry-showcase__grid--primary">
                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-3d-layered-1"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>Curated Warzone OSINT</h3>
                            <p>Military-focused conflict intelligence filtered for relevance.</p>
                        </div>
                    </article>

                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-map-layers-1"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>Layered 3D Battlespace</h3>
                            <p>Explore multi-domain events and layered intelligence on an immersive 3D globe.</p>
                        </div>
                    </article>

                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-air-tracker-1"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>Military Aircraft Tracking</h3>
                            <p>Track live military aircraft movements, activity data and focused 3D views.</p>
                        </div>
                    </article>

                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-naval-tracker-2"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>Naval Activity Monitoring</h3>
                            <p>Monitor naval contacts, vessel movements and regional maritime activity.</p>
                        </div>
                    </article>

                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-airspace-2"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>Airspace and GNSS Monitoring</h3>
                            <p>Review airspace restrictions, GNSS interference and navigation anomalies.</p>
                        </div>
                    </article>

                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-sats-1"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>Orbital Asset Intelligence</h3>
                            <p>Visualize military and dual-use satellites with tracked orbital paths.</p>
                        </div>
                    </article>
                </div>

                <div class="wz-pre-entry-showcase__grid wz-pre-entry-showcase__grid--secondary">
                    <article class="wz-pre-entry-showcase__item" aria-hidden="true"></article>
                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-sats-2"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>Satellite Observations</h3>
                            <p>Access event-linked satellite imagery, metadata and geospatial references.</p>
                        </div>
                    </article>

                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-zoom-1"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>Strategic Focus</h3>
                            <p>Focus on active conflicts, strategic flashpoints and escalation indicators.</p>
                        </div>
                    </article>

                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-aoi-1"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>AOI Intelligence</h3>
                            <p>Scan a selected area for nearby events, infrastructure and strategic locations.</p>
                        </div>
                    </article>

                    <article class="wz-pre-entry-showcase__item">
                        <span
                            class="static-icon stratops-ico-dock-cyberspace-1"
                            aria-hidden="true"
                        ></span>

                        <div>
                            <h3>Cyber and Infra Signals</h3>
                            <p>Monitor cyber activity, network disruptions and infrastructure signals.</p>
                        </div>
                    </article>

                    <article class="wz-pre-entry-showcase__item" aria-hidden="true"></article>
                </div>
            </section>

            <footer class="wz-pre-entry-showcase__footer">
                <button
                    id="wz-pre-entry-enter"
                    class="btn-secondary entry-button white"
                    type="button"
                    aria-label="Enter the StratOps battlespace platform">
                    <span aria-hidden="true"></span>
                    <span>Enter StratOps</span>
                </button>

                <div
                    class="wz-pre-entry-showcase__providers"
                    aria-label="Technology and platform providers"
                >
                    <a
                        href="https://cesium.com/platform/cesiumjs/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit the CesiumJS website"
                    >
                        <img
                            src="/assets/images/web/cesiumjs-logo.png"
                            alt="CesiumJS"
                            decoding="async"
                        />
                    </a>

                    <a
                        href="https://www.esri.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit the Esri website"
                    >
                        <img
                            src="/assets/images/web/esri-logo.png"
                            alt="Esri"
                            decoding="async"
                        />
                    </a>

                    <a
                        href="https://www.battlespacex.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit the BattlespaceX website"
                    >
                        <img
                            src="/assets/images/web/Battlespacex-full-logo.svg"
                            alt="BattlespaceX"
                            decoding="async"
                        />
                    </a>
                </div>

                <p class="platform-footer__credit sr-only">
                    Built with CesiumJS, using imagery and elevation data from Esri.
                </p>

                <p class="platform-footer__credit">
                    &copy; 2026 StratOps, powered by BattlespaceX.
                </p>
                <div class="stratops-social-channels" role="navigation" aria-label="BattlespaceX social channels">
                    <ul itemscope="" itemtype="http://schema.org/SiteNavigationElement">
                        <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://twitter.com/battlespacex" itemprop="url" title="Twitter X page" aria-label="BattleSpaceX on X (Twitter)" class="static-icon stratops-ico-social-x-1"></a></li>
                        <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.facebook.com/battlespacex" itemprop="url" title="Facebook page" aria-label="BattleSpaceX on Facebook" class="static-icon stratops-ico-social-fb-1"></a></li>
                        <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.instagram.com/battlespacex" itemprop="url" title="Instagram page" aria-label="BattleSpaceX on Instagram" class="static-icon stratops-ico-social-insta-1"></a></li>
                        <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.youtube.com/battlespacex" itemprop="url" title="Youtube channel" aria-label="BattleSpaceX on YouTube" class="static-icon stratops-ico-social-yt-1"></a></li>
                        <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.linkedin.com/company/battlespacex/" itemprop="url" title="Linkedin page" aria-label="BattleSpaceX on LinkedIn" class="static-icon stratops-ico-social-linkedin-1"></a></li>
                    </ul>
                </div>
            </footer>
        </div>
    </div>
</template>
