<template id="tpl-wz-pre-entry-showcase">
    <div id="wz-pre-entry-showcase" class="wz-pre-entry-showcase" role="dialog" aria-modal="true"
        aria-labelledby="wz-pre-entry-title" aria-describedby="wz-pre-entry-summary">
        <div class="wz-pre-entry-showcase__panel" role="document">
            <header class="wz-pre-entry-showcase__header">
                <img src="/assets/images/web/logo-stratops-battlespacex.svg" alt="StratOps by BattlespaceX"
                    class="wz-pre-entry-showcase__logo" width="300" height="79" decoding="async" />
                <h2 id="wz-pre-entry-title">Real-Time Multi-Domain<br />Battlespace Intelligence</h2>
                <p id="wz-pre-entry-summary">
                    StratOps unifies curated warzone OSINT, conflict intelligence and military tracking in a real-time 3D battlespace across air, land, sea, space and cyberspace.
                </p>
            </header>
            <section class="wz-pre-entry-showcase__grid" aria-label="StratOps capability overview">
                <article class="wz-pre-entry-showcase__item">
                    <span class="static-icon stratops-ico-assets-recon-intel-1" aria-hidden="true"></span>
                    <div>
                        <h3>Curated Warzone OSINT</h3>
                        <p>Military-focused intelligence without unrelated civilian noise.</p>
                    </div>
                </article>
                <article class="wz-pre-entry-showcase__item">
                    <span class="static-icon stratops-ico-assets-joint-1" aria-hidden="true"></span>
                    <div>
                        <h3>3D Battlespace</h3>
                        <p>Multi-domain activity visualized across an interactive globe.</p>
                    </div>
                </article>
                <article class="wz-pre-entry-showcase__item">
                    <span class="static-icon stratops-ico-dock-air-tracker-1" aria-hidden="true"></span>
                    <div>
                        <h3>Military Aircraft</h3>
                        <p>Track military-associated aircraft with focus and 3D assets.</p>
                    </div>
                </article>
                <article class="wz-pre-entry-showcase__item">
                    <span class="static-icon stratops-ico-dock-naval-tracker-1" aria-hidden="true"></span>
                    <div>
                        <h3>Naval Activity</h3>
                        <p>Monitor naval contacts, movements and operational context.</p>
                    </div>
                </article>
                <article class="wz-pre-entry-showcase__item">
                    <span class="static-icon stratops-ico-assets-space-launch-1" aria-hidden="true"></span>
                    <div>
                        <h3>Orbital Assets</h3>
                        <p>View publicly tracked military-associated satellites and orbits.</p>
                    </div>
                </article>
                <article class="wz-pre-entry-showcase__item">
                    <span class="static-icon stratops-ico-dock-airspace-1" aria-hidden="true"></span>
                    <div>
                        <h3>Airspace and GNSS</h3>
                        <p>Review restrictions, interference and aviation conditions.</p>
                    </div>
                </article>
                <article class="wz-pre-entry-showcase__item">
                    <span class="static-icon stratops-ico-dock-cyberspace-1" aria-hidden="true"></span>
                    <div>
                        <h3>Cyber and Infrastructure</h3>
                        <p>Monitor disruption signals and operational digital activity.</p>
                    </div>
                </article>
                <article class="wz-pre-entry-showcase__item">
                    <span class="static-icon stratops-ico-assets-radar-1" aria-hidden="true"></span>
                    <div>
                        <h3>Satellite Observations</h3>
                        <p>Access available event-linked imagery and observation context.</p>
                    </div>
                </article>
            </section>
            <footer class="wz-pre-entry-showcase__footer">
                <button id="wz-pre-entry-enter" class="btn-primary" type="button">
                    <span aria-hidden="true"></span>
                    <span>Enter StratOps</span>
                </button>
            </footer>
        </div>
    </div>
</template>
