<div class="warzone-brand">
    <a href="/" aria-label="stratops visualization board" class="warzone-logo">
        <img src="/assets/images/web/logo-stratops-battlespacex.svg" alt="Stratops logo" class="nav__logo" width="380" height="100" fetchpriority="high" decoding="async">
    </a>
</div>
<div class="wz-globe-toggle" role="group" aria-label="Map view mode">
    <button class="wz-globe-toggle__btn is-active"
            id="wz-toggle-3d"
            type="button"
            title="3D globe view"
            aria-label="Switch to 3D globe"
            aria-pressed="true">
        3D
    </button>
    <button class="wz-globe-toggle__btn"
            id="wz-toggle-2d"
            type="button"
            title="2D flat map view"
            aria-label="Switch to 2D flat map"
            aria-pressed="false">
        2D
    </button>
</div>
<header class="warzone-commandbar">
    <div class="warzone-region-bar">
        <span class="warzone-region-bar__label static-icon" aria-hidden="true">
            <span class="stratops-ico-global-1"></span>
        </span>

            <select aria-label="Select strategic focus" class="wz--dropdown" id="wz-lens-nav">

        <div class="wz-region-control wz-inline-input-btn" id="wz-region-control">
            <button type="button"
                    class="btn-primary wz-region-select-btn"
                    id="wz-region-nav"
                    aria-label="Open monitoring region selector">
                <span class="wz-region-select-btn__label" id="wz-region-nav-label"></span>
            </button>
        </div>
    </div>
    <div class="wz-region-control wz-inline-input-btn wz-mobile-region-trigger" id="wz-region-control-mobile">
        <button type="button"
                class="btn-primary wz-region-select-btn"
                id="wz-region-nav-mobile"
                aria-label="Open monitoring region selector">
            <span class="wz-region-select-btn__icon static-icon" aria-hidden="true">
                <i class="stratops-ico-global-1"></i>
            </span>
            <span class="wz-region-select-btn__label sr-only" id="wz-region-nav-mobile-label"></span>
        </button>
    </div>
    <div class="warzone-actions">
        <div class="warzone-status-bar">
            <div class="wz-utc-clock" id="wz-utc-clock" aria-label="Current UTC time">
                <span class="wz-utc-clock__label">UTC</span>
                <span class="wz-utc-clock__time" id="wz-utc-time">00:00:00</span>
            </div>
            <div class="wz-defcon" id="wz-defcon-badge" data-level="5" title="DEFCON status">
                <span class="wz-defcon__label">DEFCON</span>
                <span class="wz-defcon__level" id="wz-defcon-level">5</span>
            </div>
        </div>

        <button type="button"
                id="wz-nav-login-btn"
                class="btn-primary wz-nav-login-btn"
                onclick="window.__openLoginModal?.()">
                <span></span>
            <span>Sign In</span>
        </button>

        <button type="button" id="wz-support-open" class="btn-primary" aria-label="Open Founding Supporter Program"
        title="Support StratOps">
            <span></span>
            <span>Support</span>
        </button>
        <button class="action-icon"
                type="button"
                id="dock-capture-shot"
                title="Capture Shot"
                aria-label="Capture current StratOps map view">
                <span></span>
        </button>
    </div>


    <div class="warzone-mobile-settings-panel"
         id="warzone-mobile-settings-panel"
         hidden
         role="dialog"
         aria-modal="true"
         aria-labelledby="warzone-mobile-settings-title">
        <div class="warzone-mobile-settings-panel__head">
            <h2 id="warzone-mobile-settings-title">Map Settings</h2>
            <button class="warzone-mobile-settings-panel__close"
                    id="warzone-mobile-settings-close"
                    type="button"
                    aria-label="Close map settings">
                <span class="static-icon">
                    <span class="stratops-ico-close-1" aria-hidden="true"></span>
                </span>
            </button>
        </div>

        <div class="warzone-mobile-settings-panel__body">
            <div class="wz-selector">
                <label for="wz-lens-nav-mobile" class="sr-only">Select operational view</label>
                <select aria-label="Select operational view" class="wz--dropdown" id="wz-lens-nav-mobile"></select>
            </div>

        </div>

        <div class="warzone-mobile-settings-panel__footer">
            <button class="btn-primary" id="warzone-mobile-settings-apply" type="button">Update</button>
        </div>
    </div>
</header>

<div class="wz-altitude-readout" id="wz-altitude-readout" aria-live="off">
    <span class="wz-altitude-readout__line wz-altitude-readout__line--ft" id="wz-altitude-readout-ft">ALT -- FT</span>
    <span class="wz-altitude-readout__line wz-altitude-readout__line--km" id="wz-altitude-readout-km">ALT --</span>
</div>
