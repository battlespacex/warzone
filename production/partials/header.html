<div class="warzone-brand">
    <a href="/" aria-label="stratops visualization board" class="warzone-logo">
        <img src="/assets/images/web/logo-stratops-battlespacex.svg" alt="Stratops logo" class="nav__logo" width="380" height="100" fetchpriority="high" decoding="async">
    </a>
</div>

<header class="warzone-commandbar">
    <div class="warzone-region-bar">
        <span class="warzone-region-bar__label static-icon">
            <span class="stratops-ico-global-1" aria-hidden="true"></span>
        </span>

        <!-- <div class="wz-selector">
            <select aria-label="Select conflict lens" class="wz--dropdown" id="wz-lens-nav">
                <option value="live">Current Ongoing Conflicts</option>
                <option value="standoff">Long-Standing Standoffs</option>
                <option value="flashpoint">Global Flashpoints</option>
                <option value="all">All Events</option>
            </select>
        </div> -->

        <div class="wz-region-control" id="wz-region-control">
            <span class="wz-region-hint" id="wz-region-nav-hint">Select region</span>
            <button type="button"
                    class="btn-primary wz-region-select-btn"
                    id="wz-region-nav"
                    aria-label="Open monitoring region selector">
                <span id="wz-region-nav-label">Choose</span>
            </button>
        </div>
    </div>


    <div class="warzone-actions">
        <div class="warzone-status-bar">
            <div class="wz-utc-clock" id="wz-utc-clock" aria-label="Current UTC time">
                <span class="wz-utc-clock__label">UTC</span>
                <span class="wz-utc-clock__time" id="wz-utc-time">00:00:00</span>
            </div>
            <div class="wz-globe-toggle" role="group" aria-label="Map view mode">
                <button class="wz-globe-toggle__btn is-active"
                        id="wz-toggle-3d"
                        type="button"
                        title="3D globe view"
                        aria-label="Switch to 3D globe"
                        aria-pressed="true">
                    3D
                </button>
                <button class="wz-globe-toggle__btn"
                        id="wz-toggle-2d"
                        type="button"
                        title="2D flat map view"
                        aria-label="Switch to 2D flat map"
                        aria-pressed="false">
                    2D
                </button>
            </div>
            <div class="wz-defcon" id="wz-defcon-badge" data-level="5" title="DEFCON status">
                <span class="wz-defcon__label">DEFCON</span>
                <span class="wz-defcon__level" id="wz-defcon-level">5</span>
            </div>
        </div>
        <!--<div class="warzone-top-tabs">
            <button class="top-tab is-active" data-view="strikes">Strikes</button>
            <button class="top-tab" data-view="analytics">Analytics</button>
        </div>-->
        <div class="warzone-brand-actions" role="navigation" aria-label="BattlespaceX social channels">
            <!-- <a class="icon-chip" href="https://t.me/strikemaplive" target="_blank" rel="noopener noreferrer" aria-label="Telegram">TG</a>-->
            <ul itemscope="" itemtype="http://schema.org/SiteNavigationElement">
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://twitter.com/battlespacex" itemprop="url" title="Twitter X page" aria-label="BattleSpaceX on X (Twitter)" class="action-icon stratops-ico-social-X-1"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.facebook.com/battlespacex" itemprop="url" title="Facebook page" aria-label="BattleSpaceX on Facebook" class="action-icon stratops-ico-social-fb-1"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.instagram.com/battlespacex" itemprop="url" title="Instagram page" aria-label="BattleSpaceX on Instagram" class="action-icon stratops-ico-social-insta-1"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.threads.net/@battlespacex" itemprop="url" title="Insta Thread page" aria-label="BattleSpaceX on Threads" class="action-icon stratops-ico-social-th-1"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.youtube.com/@battlespacex" itemprop="url" title="Youtube channel" aria-label="BattleSpaceX on YouTube" class="action-icon stratops-ico-social-yt-1"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.linkedin.com/company/battlespacex/" itemprop="url" title="Linkedin page" aria-label="BattleSpaceX on LinkedIn" class="action-icon stratops-ico-social-linkedin-1"></a></li>
            </ul>
        </div>
        <button type="button"
                id="wz-nav-login-btn"
                class="btn-primary"
                onclick="window.__openLoginModal?.()">
            Sign In
        </button>
    </div>


    <div class="warzone-mobile-settings-panel"
         id="warzone-mobile-settings-panel"
         hidden
         role="dialog"
         aria-modal="true"
         aria-labelledby="warzone-mobile-settings-title">
        <div class="warzone-mobile-settings-panel__head">
            <h2 id="warzone-mobile-settings-title">Map Settings</h2>
            <button class="warzone-mobile-settings-panel__close"
                    id="warzone-mobile-settings-close"
                    type="button"
                    aria-label="Close map settings">
                <span class="static-icon">
                    <span class="stratops-ico-close-1" aria-hidden="true"></span>
                </span>
            </button>
        </div>

        <div class="warzone-mobile-settings-panel__body">
            <div class="wz-selector">
                <label for="wz-lens-nav-mobile" class="sr-only">Select conflict lens</label>
                <select aria-label="Select conflict lens" class="wz--dropdown" id="wz-lens-nav-mobile"></select>
            </div>

            <div class="wz-region-control" id="wz-region-control-mobile">
                <span class="wz-region-hint" id="wz-region-nav-mobile-hint">Select region</span>
                <button type="button"
                        class="btn-primary wz-region-select-btn"
                        id="wz-region-nav-mobile"
                        aria-label="Open monitoring region selector">
                    <span id="wz-region-nav-mobile-label">Choose</span>
                </button>
            </div>
        </div>

        <div class="warzone-mobile-settings-panel__footer">
            <button class="btn-primary" id="warzone-mobile-settings-apply" type="button">Update</button>
        </div>
    </div>
</header>

<div class="wz-altitude-readout" id="wz-altitude-readout" aria-live="off">
    <span class="wz-altitude-readout__line wz-altitude-readout__line--ft" id="wz-altitude-readout-ft">ALT -- FT</span>
    <span class="wz-altitude-readout__line wz-altitude-readout__line--km" id="wz-altitude-readout-km">ALT --</span>
</div>
