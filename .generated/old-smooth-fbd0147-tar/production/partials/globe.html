<section class="warzone-map-shell" aria-label="Interactive global monitoring map">
    <div id="warzone-map-credits" class="warzone-map-credits" aria-live="polite">
        <img class="warzone-map-credits__logo warzone-map-credits__logo--cesiumjs"
             src="/assets/images/web/cesiumjs-logo.png"
             alt="CesiumJS"
             decoding="async">
        <span class="seperator" aria-hidden="true"></span>
        <img class="warzone-map-credits__logo warzone-map-credits__logo--esri"
             src="/assets/images/web/esri-logo.png"
             alt="Esri"
             decoding="async">
        <span class="seperator" aria-hidden="true"></span>
        <img class="warzone-map-credits__logo warzone-map-credits__logo--battlespacex"
             src="/assets/images/web/Battlespacex-full-logo.svg"
             alt="BattlespaceX"
             decoding="async">
    </div>
    <div id="warzone-globe"
         class="warzone-globe"
         role="img"
         aria-label="3D globe showing open-source conflict activity, military movement, alerts, and monitoring overlays"></div>
</section>
