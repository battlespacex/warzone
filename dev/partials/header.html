<div class="warzone-brand">
    <a href="/" aria-label="stratops visualization board" class="warzone-logo">
        <img src="/assets/images/web/logo-stratops-battlespacex.svg" alt="Stratops logo" class="nav__logo" width="380" height="100" fetchpriority="high" decoding="async">
    </a>
</div>

<header class="warzone-commandbar">
    <button class="warzone-mobile-settings-trigger"
            id="warzone-mobile-settings-trigger"
            type="button"
            aria-label="Open map settings"
            aria-expanded="false"
            aria-controls="warzone-mobile-settings-panel">
        <span class="static-icon">
            <span class="bx-web-ico-website-R1_0" aria-hidden="true"></span>
        </span>
    </button>
    <div class="warzone-region-bar">
        <span class="warzone-region-bar__label static-icon">
            <span class="bx-web-ico-website-R1_0" aria-hidden="true"></span>
        </span>

        <div class="wz-selector">
            <select aria-label="Select conflict lens" class="wz--dropdown" id="wz-lens-nav">
                <option value="live">Current Ongoing Conflicts</option>
                <option value="standoff">Long-Standing Standoffs</option>
                <option value="flashpoint">Global Flashpoints</option>
                <option value="all">All Events</option>
            </select>
        </div>

        <div class="wz-selector">
            <select aria-label="Select monitoring region" aria-required="true" class="wz--dropdown" id="wz-region-nav"></select>
        </div>
    </div>


    <div class="warzone-actions">
        <div class="warzone-status-bar">
            <div class="wz-utc-clock" id="wz-utc-clock" aria-label="Current UTC time">
                <span class="wz-utc-clock__label">UTC</span>
                <span class="wz-utc-clock__time" id="wz-utc-time">00:00:00</span>
            </div>
            <div class="wz-defcon" id="wz-defcon-badge" data-level="5" title="DEFCON status">
                <span class="wz-defcon__label">DEFCON</span>
                <span class="wz-defcon__level" id="wz-defcon-level">5</span>
            </div>
            <!-- <div class="wz-globe-toggle">
         <button class="wz-globe-toggle__btn is-active" id="wz-toggle-3d" type="button" title="3D Globe view" aria-label="Switch to 3D globe">3D</button>
         <button class="wz-globe-toggle__btn" id="wz-toggle-2d" type="button" title="2D Map view" aria-label="Switch to 2D map">2D</button>
     </div>-->
        </div>
        <!--<div class="warzone-top-tabs">
        <button class="top-tab is-active" data-view="strikes">Strikes</button>
        <button class="top-tab" data-view="analytics">Analytics</button>
    </div>-->
        <div class="warzone-brand-actions">
            <!-- <a class="icon-chip" href="https://t.me/strikemaplive" target="_blank" rel="noopener noreferrer" aria-label="Telegram">TG</a>-->
            <ul itemscope="" itemtype="http://schema.org/SiteNavigationElement">
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://twitter.com/battlespacex" itemprop="url" title="Twitter X page" class="action-icon bx-web-ico-X-1-0"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.facebook.com/battlespacex" itemprop="url" title="Facebook page" class="action-icon bx-web-ico-fb-1-0"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.instagram.com/battlespacex" itemprop="url" title="Instagram page" class="action-icon bx-web-ico-insta-1-0"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.threads.net/@battlespacex" itemprop="url" title="Insta Thread page" class="action-icon bx-web-ico-th-1-1"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.youtube.com/@battlespacex" itemprop="url" title="Youtube channel" class="action-icon bx-web-ico-yt-1-0"></a></li>
                <li itemscope="" itemtype="http://schema.org/ListItem"><a href="https://www.linkedin.com/company/battlespacex/" itemprop="url" title="Linkedin page" class="action-icon bx-web-ico-in-1-1"></a></li>
            </ul>
        </div>
    </div>


    <div class="warzone-mobile-settings-panel"
         id="warzone-mobile-settings-panel"
         hidden
         role="dialog"
         aria-modal="true"
         aria-labelledby="warzone-mobile-settings-title">
        <div class="warzone-mobile-settings-panel__head">
            <h2 id="warzone-mobile-settings-title">Map Settings</h2>
            <button class="warzone-mobile-settings-panel__close"
                    id="warzone-mobile-settings-close"
                    type="button"
                    aria-label="Close map settings">
                <span class="static-icon">
                    <span class="bx-web-ico-close-1-1" aria-hidden="true"></span>
                </span>
            </button>
        </div>

        <div class="warzone-mobile-settings-panel__body">
            <div class="wz-selector">
                <label for="wz-lens-nav-mobile" class="sr-only">Select conflict lens</label>
                <select aria-label="Select conflict lens" class="wz--dropdown" id="wz-lens-nav-mobile"></select>
            </div>

            <div class="wz-selector">
                <label for="wz-region-nav-mobile" class="sr-only">Select monitoring region</label>
                <select aria-label="Select monitoring region" class="wz--dropdown" id="wz-region-nav-mobile"></select>
            </div>
        </div>

        <div class="warzone-mobile-settings-panel__footer">
            <button class="btn-primary" id="warzone-mobile-settings-apply" type="button">Update</button>
        </div>
    </div>
</header>
