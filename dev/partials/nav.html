<nav class="wz-dock" aria-label="Map controls">
    <div class="wz-btn-container" role="toolbar" aria-label="Dock actions">
        <button class="wz-dock__btn wz-dock__btn--widget"
                type="button"
                data-dock-widget="counter"
                title="Toggle strike counter widget"
                aria-label="Toggle strike counter widget">
            <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-strike-counter-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">Counter</span>
        </button>

        <button class="wz-dock__btn wz-dock__btn--widget"
                type="button"
                data-dock-widget="cyber"
                title="Toggle cyber status widget"
                aria-label="Toggle cyber status widget">
            <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-cyberspace-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">Cyber</span>
        </button>

        <button class="wz-dock__btn wz-dock__btn--widget"
                type="button"
                data-dock-widget="airspace"
                title="Toggle airspace status widget"
                aria-label="Toggle airspace status widget">
            <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-airspace-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">Airspace</span>
        </button>

        <button class="wz-dock__btn wz-dock__btn--widget"
                type="button"
                data-dock-widget="aircraft"
                title="Toggle aircraft tracker widget"
                aria-label="Toggle aircraft tracker widget">
            <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-air-tracker-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">Aircraft Tracker</span>
        </button>
        <button class="wz-dock__btn wz-dock__btn--widget"
                type="button"
                data-dock-widget="naval"
                title="Toggle naval tracker widget"
                aria-label="Toggle naval tracker widget">
                <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-naval-tracker-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">Naval Tracker</span>
        </button>

        <button class="wz-dock__btn wz-dock__btn--widget"
                type="button"
                data-dock-widget="feed"
                title="Toggle wires widget"
                aria-label="Toggle wires widget">
            <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-news-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">Wires</span>
        </button>

        <button class="wz-dock__btn wz-dock__btn--widget"
                type="button"
                data-dock-widget="escalation"
                title="Toggle escalation meter widget"
                aria-label="Toggle escalation meter widget">
            <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-escalation-meter-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">Escalation</span>
        </button>

        <button class="wz-dock__btn wz-dock__btn--widget"
                type="button"
                data-dock-widget="layers"
                title="Toggle map layers widget"
                aria-label="Toggle map layers widget">
            <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-map-layers-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">Layers</span>
        </button>

        <button class="wz-dock__btn"
                type="button"
                id="dock-fullscreen"
                title="Toggle fullscreen"
                aria-label="Toggle fullscreen mode">
            <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-zoom-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">Fullscreen</span>
        </button>

        <button class="wz-dock__btn"
                type="button"
                id="dock-about"
                title="Open about, terms, and data policy"
                aria-label="Open about, terms, and data policy">
            <span class="wz-dock__icon">
                <span class="static-icon stratops-ico-dock-stratops-1" aria-hidden="true"></span>
            </span>
            <span class="wz-dock__label">About</span>
        </button>
    </div>
</nav>
