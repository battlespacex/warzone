<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#03070c" />
    <title>StratOps Operational Reports </title>
    <link rel="icon" href="/assets/images/fav/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/assets/fonts/stratops/style.css" />
    <style>
        @font-face {
            font-family: "BX-H";
            font-display: swap;
            src:
                url("/assets/fonts/custom/bx-heading.woff2") format("woff2"),
                url("/assets/fonts/custom/bx-heading.woff") format("woff"),
                url("/assets/fonts/custom/bx-heading.ttf") format("truetype");
        }

        @font-face {
            font-family: "BX-Official";
            font-display: swap;
            src: url("/assets/fonts/custom/bx-official-font.ttf") format("truetype");
        }

        @font-face {
            font-family: "OCRAExtended";
            font-display: swap;
            src:
                url("/assets/fonts/custom/OCRAExtended.woff") format("woff"),
                url("/assets/fonts/custom/OCRAExtended.ttf") format("truetype");
        }

        :root {
            color-scheme: dark;
            --report-bg: #03070c;
            --report-panel: #08111d;
            --report-panel-strong: #0d1927;
            --report-line: rgba(122, 242, 255, 0.24);
            --report-line-strong: rgba(42, 245, 230, 0.72);
            --report-text: #e7edf7;
            --report-muted: #9aa8b9;
            --report-cyan: #28f5e6;
            --report-white: #ffffff;
            --font-title: "BX-H", "OCRAExtended", Arial, sans-serif;
            --font-body: "BX-Official", "OCRAExtended", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--report-bg);
            color: var(--report-text);
            font-family: var(--font-body);
            letter-spacing: 0;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(7, 17, 27, 0.94), rgba(3, 7, 12, 0.98)),
                radial-gradient(circle at 50% -10%, rgba(40, 245, 230, 0.16), transparent 36%),
                url("/assets/images/web/stratops-og-preview.jpg") center / cover no-repeat;
            opacity: 0.92;
        }

        .report-shell {
            position: relative;
            z-index: 1;
            display: grid;
            min-height: 100vh;
            padding: clamp(1.4rem, 3vw, 2.4rem);
        }

        .report-brand {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 6.5rem;
        }

        .report-brand img {
            width: min(34rem, 72vw);
            height: auto;
            display: block;
        }

        .report-stage {
            width: min(94rem, 100%);
            min-height: min(76vh, 58rem);
            margin: 0 auto;
            align-self: center;
            display: grid;
            grid-template-rows: auto minmax(24rem, 1fr);
            background: rgba(8, 17, 29, 0.9);
            border: 1px solid var(--report-line);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 1.4rem 4rem rgba(0, 0, 0, 0.42);
        }

        .report-head {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: center;
            padding: clamp(1rem, 2vw, 1.5rem);
            border-bottom: 1px solid var(--report-line);
            background: linear-gradient(180deg, rgba(13, 25, 39, 0.94), rgba(8, 17, 29, 0.9));
        }

        .report-kicker {
            margin: 0 0 0.3rem;
            color: var(--report-cyan);
            font-family: var(--font-title);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .report-title {
            margin: 0;
            color: var(--report-white);
            font-family: var(--font-title);
            font-size: clamp(1.15rem, 2vw, 1.7rem);
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .report-meta {
            margin: 0.45rem 0 0;
            color: var(--report-muted);
            font-size: 0.95rem;
        }

        .report-actions {
            display: flex;
            gap: 0.7rem;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .report-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 2.65rem;
            padding: 0 1.1rem;
            border: 1px solid var(--report-line-strong);
            background: var(--report-white);
            color: #03070c;
            font-family: var(--font-title);
            font-size: 0.82rem;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
        }

        .report-button[aria-disabled="true"] {
            pointer-events: none;
            opacity: 0.45;
        }

        .report-body {
            position: relative;
            display: grid;
            min-height: 0;
            background: #03070c;
        }

        .report-frame {
            width: 100%;
            min-height: min(72vh, 52rem);
            height: 100%;
            border: 0;
            background: #03070c;
        }

        .report-status {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: rgba(3, 7, 12, 0.92);
            color: var(--report-muted);
            text-align: center;
        }

        .report-status[hidden] {
            display: none;
        }

        .report-status__box {
            width: min(34rem, 100%);
            padding: 1.5rem;
            border: 1px solid var(--report-line);
            background: var(--report-panel);
        }

        .report-status__title {
            margin: 0 0 0.6rem;
            color: var(--report-white);
            font-family: var(--font-title);
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .report-status__text {
            margin: 0;
            line-height: 1.45;
        }

        @media (max-width: 720px) {
            .report-shell {
                padding: 1rem;
            }

            .report-stage {
                align-self: start;
                min-height: calc(100vh - 8rem);
            }

            .report-head {
                grid-template-columns: 1fr;
            }

            .report-actions {
                justify-content: stretch;
            }

            .report-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="report-shell" aria-label="StratOps operational reports viewer">
        <div class="report-brand">
            <a href="/warzone/" aria-label="Return to StratOps">
                <img src="/assets/images/web/logo-stratops-battlespacex.svg" alt="BattlespaceX StratOps" width="380" height="100" />
            </a>
        </div>

        <section class="report-stage" aria-labelledby="report-title">
            <header class="report-head">
                <div>
                    <p class="report-kicker">Operational Intelligence Reports</p>
                    <h1 class="report-title" id="report-title">StratOps Reports</h1>
                    <p class="report-meta" id="report-meta">Preparing reports metadata.</p>
                </div>
                <div class="report-actions">
                    <a class="report-button" id="report-download" href="#" aria-disabled="true">Download PDF</a>
                </div>
            </header>

            <div class="report-body">
                <iframe class="report-frame" id="report-frame" title="StratOps PDF report" hidden></iframe>
                <div class="report-status" id="report-status">
                    <div class="report-status__box">
                        <p class="report-status__title" id="report-status-title">Preparing Report</p>
                        <p class="report-status__text" id="report-status-text">The PDF will load here when the cached report is available.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var slug = decodeURIComponent(String(window.location.pathname || "").split("/reports/").pop() || "").replace(/\/+$/, "");
        var pollCount = 0;
        var maxPolls = params.has("generating") ? 40 : 1;
        if (params.has("generating")) {
            try {
                window.history.replaceState({}, "", window.location.pathname);
            } catch (error) { }
        }

        var title = document.getElementById("report-title");
        var meta = document.getElementById("report-meta");
        var frame = document.getElementById("report-frame");
        var download = document.getElementById("report-download");
        var status = document.getElementById("report-status");
        var statusTitle = document.getElementById("report-status-title");
        var statusText = document.getElementById("report-status-text");

        function setStatus(heading, message, visible) {
            if (statusTitle) statusTitle.textContent = heading || "";
            if (statusText) statusText.textContent = message || "";
            if (status) status.hidden = visible === false;
        }

        function formatDate(value) {
            var date = new Date(value);
            if (Number.isNaN(date.getTime())) return "";
            return date.toLocaleString([], {
                year: "numeric",
                month: "short",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function reportTitle(report) {
            var type = String(report.report_type || "daily").toUpperCase();
            var scope = String(report.scope_label || report.scope_value || "Global");
            return type + " - " + scope;
        }

        function reportPeriod(report) {
            return [formatDate(report.period_start), formatDate(report.period_end)].filter(Boolean).join(" to ");
        }

        function downloadUrl(report) {
            var id = String(report.id || "").trim();
            var token = String(report.download_token || "").trim();
            if (!id || !token) return "";
            return "/api/stratops/reports/" + encodeURIComponent(id) + "/download?token=" + encodeURIComponent(token);
        }

        function viewerUrl(report, pdfUrl) {
            var viewer = new URL("/pages/report-pdf-viewer.html", window.location.origin);
            viewer.searchParams.set("file", pdfUrl);
            viewer.searchParams.set("download", pdfUrl);
            viewer.searchParams.set("filename", reportTitle(report) + ".pdf");
            return viewer.href;
        }

        function render(report) {
            var pdfUrl = downloadUrl(report);
            if (!pdfUrl) {
                setStatus("Report Unavailable", "This report does not have a PDF download token.", true);
                return;
            }
            document.title = reportTitle(report) + " | StratOps";
            if (title) title.textContent = reportTitle(report);
            if (meta) {
                meta.textContent = [
                    reportPeriod(report),
                    report.expires_at ? "Expires " + formatDate(report.expires_at) : ""
                ].filter(Boolean).join(" | ");
            }
            if (download) {
                download.href = pdfUrl;
                download.removeAttribute("aria-disabled");
            }
            if (frame) {
                frame.src = viewerUrl(report, pdfUrl);
                frame.hidden = false;
            }
            setStatus("", "", false);
        }

        function retryOrFail(message) {
            pollCount += 1;
            if (pollCount < maxPolls) {
                setStatus("Preparing Report", "The backend is generating or retrieving the cached PDF.", true);
                window.setTimeout(loadReport, 3000);
                return;
            }
            if (meta) meta.textContent = "Report unavailable.";
            setStatus("Report Unavailable", message || "The requested report could not be found.", true);
        }

        async function loadReport() {
            if (!slug) {
                retryOrFail("The report URL is missing a report slug.");
                return;
            }
            try {
                var response = await fetch("/api/stratops/reports/slug/" + encodeURIComponent(slug), {
                    headers: { "Accept": "application/json" },
                    cache: "no-store"
                });
                if (!response.ok) {
                    retryOrFail("The requested report is not available yet.");
                    return;
                }
                var payload = await response.json();
                if (!payload || !payload.report) {
                    retryOrFail("The requested report metadata is unavailable.");
                    return;
                }
                render(payload.report);
            } catch (error) {
                retryOrFail("The report service is unavailable.");
            }
        }

        loadReport();
    }());
    </script>
</body>
</html>
