<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title><%= meta.title %></title>
    <meta name="description" content="<%= meta.description %>" />
    <link rel="canonical" href="<%= meta.canonical %>" />
    <meta name="robots" content="<%= meta.robots %>" />
    <link rel="alternate" hreflang="en-ca" href="<%= meta.hreflang %>" />
    <link rel="alternate" hreflang="x-default" href="<%= meta.hreflang %>" />
    <%= partials("head-base") %>
    <%= partials("head-verifications") %>
    <meta property="og:url" content="<%= meta.ogUrl %>" />
    <meta property="og:title" content="<%= meta.ogTitle %>" />
    <meta property="og:description" content="<%= meta.ogDescription %>" />
    <meta property="og:image" content="<%= meta.ogImage %>" />
    <meta property="og:image:secure_url" content="<%= meta.ogImage %>" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="<%= meta.ogAlt %>" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= meta.twTitle %>" />
    <meta name="twitter:description" content="<%= meta.twDescription %>" />
    <meta name="twitter:image" content="<%= meta.twImage %>" />
    <meta name="twitter:image:alt" content="<%= meta.twAlt %>" />
    <script type="application/ld+json"><%= JSON.stringify(meta.jsonLd) %></script>
</head>
<body class="other-pages">
    <a class="skip-link sr-only" href="#main">Skip to main content</a>
    <div class="body-bg" aria-hidden="true"></div>
    <%= partials("header") %>
    <main aria-label="Not found page">
        <section class="hero-banner">
            <div class="hero-banner__box">
                <div class="hero-banner__eyebrow">404</div>
                <h1 class="hero-banner__title">Page Not Found</h1>
                <p class="hero-banner__desc">The page you requested does not exist.</p>
                <div class="hero-banner__actions">
                    <a class="btn btn--primary" href="/warzone/">Return Home</a>
                </div>
            </div>
        </section>
    </main>
    <%= partials("footer") %>
</body>
</html>
